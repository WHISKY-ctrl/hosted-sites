<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>سحوره · سيوده · عالم الحب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial Black', 'Tahoma', cursive, sans-serif;
        }

        body {
            background: #030005;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0e6ff;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== تأثير إضاءة حواف الشاشة ثلاثي الأبعاد ===== */
        .edge-glow-3d {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 9999;
            border-radius: 0; /* للحواف المستقيمة */
            overflow: hidden;
        }

        /* المسار الضوئي الرئيسي - يتحرك بشكل دائري حول الحواف */
        .light-path {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 4px solid transparent;
            border-radius: 0; /* حواف حادة للشاشة */
            box-shadow: 
                0 0 30px #ff44ee,
                0 0 60px #aa44ff,
                inset 0 0 30px #ff88ff,
                inset 0 0 60px #ff44cc;
            animation: edgePulse 3s ease-in-out infinite;
        }

        /* الأضواء المتحركة على الحواف الأربعة */
        .edge-runner {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .runner {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, 
                rgba(255, 100, 255, 0.9) 0%,
                rgba(170, 68, 255, 0.5) 40%,
                transparent 70%
            );
            filter: blur(25px);
            animation: runAround 8s linear infinite;
            mix-blend-mode: screen;
        }

        .runner:nth-child(2) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, 
                rgba(100, 200, 255, 0.8) 0%,
                rgba(150, 50, 255, 0.4) 40%,
                transparent 70%
            );
            filter: blur(35px);
            animation: runAround 12s linear infinite reverse;
            mix-blend-mode: overlay;
        }

        .runner:nth-child(3) {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, 
                rgba(255, 150, 255, 1) 0%,
                rgba(255, 50, 200, 0.6) 40%,
                transparent 70%
            );
            filter: blur(20px);
            animation: runAround 6s linear infinite;
            animation-delay: -2s;
            mix-blend-mode: hard-light;
        }

        @keyframes runAround {
            0% {
                top: -75px;
                left: -75px;
                opacity: 0;
            }
            12.5% {
                top: -75px;
                left: 50%;
                transform: translateX(-50%);
                opacity: 1;
            }
            25% {
                top: -75px;
                right: -75px;
                left: auto;
                opacity: 0.8;
            }
            37.5% {
                top: 50%;
                right: -75px;
                transform: translateY(-50%);
                opacity: 1;
            }
            50% {
                bottom: -75px;
                right: -75px;
                top: auto;
                opacity: 0.8;
            }
            62.5% {
                bottom: -75px;
                left: 50%;
                transform: translateX(-50%);
                opacity: 1;
            }
            75% {
                bottom: -75px;
                left: -75px;
                opacity: 0.8;
            }
            87.5% {
                top: 50%;
                left: -75px;
                transform: translateY(-50%);
                opacity: 1;
            }
            100% {
                top: -75px;
                left: -75px;
                opacity: 0;
            }
        }

        /* أشعة ضوئية ثابتة على الزوايا */
        .corner-beam {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 0 0, 
                rgba(255, 68, 238, 0.6),
                transparent 70%
            );
            filter: blur(40px);
            pointer-events: none;
        }

        .corner-beam.top-left {
            top: -50px;
            left: -50px;
            background: radial-gradient(circle at 0 0, 
                rgba(255, 68, 238, 0.6),
                rgba(170, 68, 255, 0.4),
                transparent 70%
            );
        }

        .corner-beam.top-right {
            top: -50px;
            right: -50px;
            background: radial-gradient(circle at 100% 0, 
                rgba(170, 68, 255, 0.6),
                rgba(100, 200, 255, 0.4),
                transparent 70%
            );
        }

        .corner-beam.bottom-left {
            bottom: -50px;
            left: -50px;
            background: radial-gradient(circle at 0 100%, 
                rgba(255, 100, 255, 0.6),
                rgba(255, 44, 200, 0.4),
                transparent 70%
            );
        }

        .corner-beam.bottom-right {
            bottom: -50px;
            right: -50px;
            background: radial-gradient(circle at 100% 100%, 
                rgba(200, 68, 255, 0.6),
                rgba(255, 100, 238, 0.4),
                transparent 70%
            );
        }

        /* خطوط متحركة رفيعة على الحواف */
        .edge-lines {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 2px solid transparent;
            border-image: linear-gradient(90deg, 
                #ff44ee, #aa44ff, #ff88ff, #ff44cc, #ff44ee
            ) 1;
            animation: borderRotate 4s linear infinite;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes borderRotate {
            0% {
                border-image-source: linear-gradient(0deg, 
                    #ff44ee, #aa44ff, #ff88ff, #ff44cc, #ff44ee
                );
            }
            25% {
                border-image-source: linear-gradient(90deg, 
                    #ff44ee, #aa44ff, #ff88ff, #ff44cc, #ff44ee
                );
            }
            50% {
                border-image-source: linear-gradient(180deg, 
                    #ff44ee, #aa44ff, #ff88ff, #ff44cc, #ff44ee
                );
            }
            75% {
                border-image-source: linear-gradient(270deg, 
                    #ff44ee, #aa44ff, #ff88ff, #ff44cc, #ff44ee
                );
            }
            100% {
                border-image-source: linear-gradient(360deg, 
                    #ff44ee, #aa44ff, #ff88ff, #ff44cc, #ff44ee
                );
            }
        }

        /* تأثير 3D برسپكتيف للحواف */
        .edge-3d-perspective {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 4px solid transparent;
            border-radius: 0;
            transform: perspective(40px) rotateX(1deg) rotateY(1deg);
            box-shadow: 
                0 0 40px #ff44ee,
                0 0 80px #aa44ff,
                inset 0 0 40px #ff88ff,
                inset 0 0 80px #ff44cc;
            animation: perspectiveGlow 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes perspectiveGlow {
            0%, 100% {
                opacity: 0.7;
                transform: perspective(40px) rotateX(1deg) rotateY(1deg) scale(1);
                border-color: rgba(255, 68, 238, 0.3);
            }
            50% {
                opacity: 1;
                transform: perspective(40px) rotateX(1.5deg) rotateY(1.5deg) scale(1.02);
                border-color: rgba(255, 136, 255, 0.6);
            }
        }

        /* ===== عناصر التساقط المشتركة ===== */
        .falling-item {
            position: absolute;
            top: -20px;
            z-index: 50;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
        }

        /* ===== شاشة التحميل المتحسنة للجوال ===== */
        .loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #08000e;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 1s ease, visibility 1s;
            overflow: hidden;
        }
        .loading-hidden {
            opacity: 0;
            visibility: hidden;
        }

        .spinner-circle {
            width: min(80vw, 450px);
            height: min(80vw, 450px);
            border-radius: 50%;
            background: conic-gradient(#ff33ff, #b266ff, #ff66cc, #cc33ff, #ff33cc, #ff99ff, #ff33ff, #ff66ff);
            animation: spin 0.8s infinite linear;
            box-shadow: 0 0 min(10vw, 200px) #ff66ff, 0 0 min(15vw, 350px) #bf3fff, inset 0 0 min(8vw, 150px) #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .spinner-circle::after {
            content: '';
            position: absolute;
            width: 70%;
            height: 70%;
            background: #0d001c;
            border-radius: 50%;
            box-shadow: inset 0 0 min(8vw, 150px) #f3c6ff;
        }

        .loading-text {
            position: absolute;
            z-index: 20;
            font-size: min(10vw, 4.5rem);
            font-weight: 900;
            text-align: center;
            color: #ffdbff;
            text-shadow: 0 0 min(4vw, 80px) #ffb3ff, 0 0 min(8vw, 160px) #ff4dff, 0 0 min(12vw, 250px) #c624ff;
            animation: textGlow 1.8s infinite alternate;
            white-space: nowrap;
            background: linear-gradient(135deg, #ffffff, #ffd0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes textGlow {
            0% { opacity: 0.9; letter-spacing: 2px; }
            100% { opacity: 1; letter-spacing: min(1vw, 14px); text-shadow: 0 0 min(6vw, 120px) #ffb8ff, 0 0 min(12vw, 280px) #ff4dc6; }
        }

        /* ===== الصفحة الرئيسية (كلمة المرور) متجاوبة ===== */
        .main-page {
            width: 100%;
            min-height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at top, #1f0b35, #010001);
            padding: 15px;
            position: relative;
            overflow: hidden;
        }

        .main-falling {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .main-falling-item {
            position: absolute;
            top: -20px;
            color: #ff99ff;
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            filter: drop-shadow(0 0 min(1vw, 20px) #ff66ff);
            animation: mainFall linear infinite;
            white-space: nowrap;
            z-index: 5;
        }

        @keyframes mainFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(18, 5, 36, 0.95);
            backdrop-filter: blur(30px);
            border: 4px solid #da88ff;
            border-radius: 60px 20px 60px 20px;
            box-shadow: 0 0 min(10vw, 300px) #bc5eff, 0 0 min(5vw, 150px) #e79dff inset;
            padding: 2.5rem 1.5rem;
            text-align: center;
            transform: perspective(1500px) rotateX(2deg);
            position: relative;
            z-index: 10;
        }

        .glow-title {
            font-size: clamp(3rem, 15vw, 8rem);
            font-weight: 900;
            color: #fdd3ff;
            text-shadow: 0 0 min(4vw, 80px) #ffb5ff, 0 0 min(8vw, 180px) #cf6eff, 0 0 min(12vw, 300px) #b200ff;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .input-password {
            background: #220c33;
            border: 4px solid #ec9eff;
            border-radius: 50px;
            padding: 1.2rem 1rem;
            width: 100%;
            font-size: clamp(1.8rem, 6vw, 4.5rem);
            text-align: center;
            color: #ffeaff;
            caret-color: #ffb5ff;
            box-shadow: 0 0 min(8vw, 200px) #f685ff, inset 0 0 min(4vw, 100px) #ffdbff;
            outline: none;
            margin: 2rem 0;
            font-weight: bold;
        }

        .input-password::placeholder {
            color: #c999ff;
            font-size: clamp(1.2rem, 4vw, 3.5rem);
        }

        .glow-button {
            background: #2d0f47;
            border: 4px solid;
            border-image-slice: 1;
            border-image-source: linear-gradient(145deg, #ffadff, #ba5eff, #ff95e5);
            padding: 1.5rem 2rem;
            font-size: clamp(2rem, 8vw, 5.5rem);
            font-weight: 900;
            color: #fff5fe;
            text-shadow: 0 0 min(4vw, 100px) #ffc2ff, 0 0 min(8vw, 200px) #ff75f0;
            border-radius: 80px;
            cursor: pointer;
            box-shadow: 0 0 min(10vw, 250px) #ff94ff, 0 0 min(15vw, 400px) #d158ff;
            animation: breath 1.7s infinite alternate;
            transition: 0.3s;
            width: 100%;
        }

        @keyframes breath {
            0% { box-shadow: 0 0 min(6vw, 150px) #ffb9ff, 0 0 min(10vw, 280px) #d165ff; border-color: #ffb5ff; }
            100% { box-shadow: 0 0 min(10vw, 280px) #ffb2ff, 0 0 min(15vw, 450px) #ff4eff; border-color: #fff3b2; }
        }
        .glow-button:hover {
            transform: scale(1.05);
            background: #401b64;
        }

        /* ===== الصفحة الاحتفالية المتجاوبة بالكامل ===== */
        .love-page {
            width: 100%;
            min-height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            background: #0a0014;
            position: relative;
            padding: 20px 10px 40px;
            overflow-x: hidden;
        }

        /* أمطار القلوب والأشكال ثلاثية الأبعاد - متجاوبة */
        .hearts-rain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .heart-drop, .name-drop {
            position: absolute;
            top: -20px;
            filter: drop-shadow(0 0 min(1.5vw, 30px) #ff44ee);
            animation: rainFall linear infinite;
            text-shadow: 0 0 min(1.5vw, 30px) #ff99ff, 0 0 min(3vw, 60px) #ff44cc;
            white-space: nowrap;
            font-weight: 900;
            z-index: 1;
        }

        @keyframes rainFall {
            0% { transform: translateY(-20vh) rotate(0deg) scale(1); opacity: 0.9; }
            100% { transform: translateY(120vh) rotate(720deg) scale(1.8); opacity: 0; }
        }

        /* ===== إضاءات متحركة على الحواف ===== */
        .edge-lights {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .light-beam {
            position: absolute;
            width: 4px;
            height: 150px;
            background: linear-gradient(180deg, transparent, #ff44ee, #aa44ff, #ff88ff, transparent);
            filter: blur(8px);
            animation: lightFall linear infinite;
            opacity: 0.8;
            box-shadow: 0 0 30px #ffaaff, 0 0 60px #ff44ff;
        }

        .light-beam:nth-child(odd) {
            background: linear-gradient(180deg, transparent, #44aaff, #8844ff, #ff66cc, transparent);
            box-shadow: 0 0 30px #88aaff, 0 0 60px #aa66ff;
        }

        @keyframes lightFall {
            0% {
                transform: translateY(-150px) rotate(0deg) scale(1);
                opacity: 0.9;
            }
            100% {
                transform: translateY(calc(100vh + 150px)) rotate(360deg) scale(1.5);
                opacity: 0;
            }
        }

        /* المحتوى فوق المطر */
        .love-content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* العنوان الرئيسي متجاوب */
        .main-title-3d {
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 900;
            background: linear-gradient(145deg, #ffd0ff, #fcacff, #ff7bff, #d98eff, #ffa6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 min(4vw, 120px) #ff80ff, 0 0 min(6vw, 200px) #f248ff, 0 0 min(8vw, 300px) #b200ff;
            transform: perspective(2000px) rotateY(4deg) rotateX(3deg) translateZ(10px);
            animation: advancedTitle 6s infinite alternate ease-in-out;
            line-height: 1.3;
            text-align: center;
            white-space: normal;
            letter-spacing: 2px;
            margin-bottom: 10px;
            word-break: break-word;
        }
        @keyframes advancedTitle {
            0% { transform: perspective(2000px) rotateY(2deg) rotateX(2deg) translateZ(5px); text-shadow: 0 0 min(3vw, 100px) #ff7bff, 0 0 min(6vw, 250px) #ff42d8; }
            50% { transform: perspective(2000px) rotateY(8deg) rotateX(5deg) translateZ(15px); text-shadow: 0 0 min(6vw, 200px) #ffb3ff, 0 0 min(8vw, 350px) #ff38ff; }
            100% { transform: perspective(2000px) rotateY(4deg) rotateX(4deg) translateZ(10px); text-shadow: 0 0 min(4vw, 150px) #ffb2ff, 0 0 min(7vw, 300px) #f064ff; }
        }

        /* ===== الصور العمودية (حقيقية) ===== */
        .vertical-images {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
        }

        .image-card {
            width: 100%;
            background: rgba(22, 5, 43, 0.8);
            backdrop-filter: blur(25px);
            border: 3px solid #ffb3ff;
            border-radius: 50px 15px 50px 15px;
            padding: 1.5rem 1rem;
            box-shadow: 0 0 min(6vw, 200px) #ff80ff, 0 0 min(3vw, 80px) #c44eff inset;
            transition: 0.5s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        /* تأثير الإضاءة المتحركة حول الصور */
        .image-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, #ff66ff, #aa44ff, #ff88ff, transparent);
            animation: rotateGlow 4s linear infinite;
            opacity: 0.6;
            z-index: -1;
        }

        .image-card::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: rgba(22, 5, 43, 0.95);
            border-radius: 50px 15px 50px 15px;
            z-index: -1;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .image-card:hover {
            transform: scale(1.02) translateZ(20px);
            border-color: #ffe6ff;
        }

        /* الصور الحقيقية */
        .real-img {
            width: 100%;
            border-radius: 40px 10px 40px 10px;
            border: 4px solid #ffc8ff;
            box-shadow: 0 0 min(6vw, 200px) #ffaaff, 0 0 min(4vw, 120px) #ffd6ff inset;
            animation: imageSpin 10s infinite linear, imageGlow 2.4s infinite alternate;
            transform-style: preserve-3d;
            perspective: 1000px;
            aspect-ratio: 1/1;
            object-fit: cover;
            transition: all 0.5s ease;
            filter: brightness(1.1) contrast(1.1);
        }

        @keyframes imageSpin {
            0% {
                transform: perspective(1000px) rotateY(0deg) rotateX(5deg) scale(0.95);
                box-shadow: 0 0 30px #ff66ff, 0 0 60px #aa44ff;
            }
            25% {
                transform: perspective(1000px) rotateY(90deg) rotateX(10deg) scale(1);
                box-shadow: 0 0 50px #ff99ff, 0 0 100px #ff44cc;
            }
            50% {
                transform: perspective(1000px) rotateY(180deg) rotateX(5deg) scale(0.95);
                box-shadow: 0 0 30px #aa88ff, 0 0 60px #8844ff;
            }
            75% {
                transform: perspective(1000px) rotateY(270deg) rotateX(-5deg) scale(1);
                box-shadow: 0 0 50px #ff88cc, 0 0 100px #ff66aa;
            }
            100% {
                transform: perspective(1000px) rotateY(360deg) rotateX(5deg) scale(0.95);
                box-shadow: 0 0 30px #ff66ff, 0 0 60px #aa44ff;
            }
        }

        @keyframes imageGlow {
            0% {
                filter: brightness(1.1) contrast(1.1) drop-shadow(0 0 20px #ff66ff);
                border-color: #ffc8ff;
            }
            50% {
                filter: brightness(1.3) contrast(1.2) drop-shadow(0 0 40px #ff99ff) drop-shadow(0 0 80px #ff44ff);
                border-color: #ffffff;
            }
            100% {
                filter: brightness(1.2) contrast(1.15) drop-shadow(0 0 30px #aa88ff) drop-shadow(0 0 60px #ff66cc);
                border-color: #ffe6ff;
            }
        }

        /* الكابتشن متجاوب */
        .card-caption {
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: 900;
            color: #fff2ff;
            text-shadow: 0 0 min(2vw, 40px) #ffa2ff, 0 0 min(3vw, 80px) #ff7bff, 0 0 min(5vw, 140px) #fa4dff;
            background: rgba(48, 12, 80, 0.6);
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            border: 3px solid #ffccff;
            backdrop-filter: blur(12px);
            transform: perspective(500px) rotateX(1deg);
            width: fit-content;
            margin: 5px 0;
            letter-spacing: 1px;
            box-shadow: 0 0 min(3vw, 70px) #ffa1f0;
            animation: captionGlow 3s infinite alternate;
        }

        @keyframes captionGlow {
            0% { text-shadow: 0 0 20px #ffa2ff, 0 0 40px #ff7bff; }
            100% { text-shadow: 0 0 40px #ffd6ff, 0 0 80px #ffaaff, 0 0 120px #ff66ff; }
        }

        /* تذييل متجاوب */
        .love-footer {
            font-size: clamp(2rem, 7vw, 4rem);
            font-weight: 900;
            background: linear-gradient(145deg, #ffbeff, #ff9cf5, #d57bff, #ffadff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 min(5vw, 150px) #ffb0ff, 0 0 min(8vw, 300px) #f062f0;
            transform: perspective(1800px) rotateY(3deg) rotateX(2deg);
            animation: footerGlide 7s infinite;
            margin: 30px 0 20px;
            text-align: center;
            line-height: 1.3;
            padding: 0 10px;
        }
        @keyframes footerGlide {
            0% { transform: perspective(1800px) rotateY(1deg) rotateX(1deg) translateZ(0); }
            50% { transform: perspective(1800px) rotateY(8deg) rotateX(3deg) translateZ(10px); text-shadow: 0 0 min(6vw, 200px) #ffc8ff,0 0 min(10vw, 400px) #fb6eff; }
        }

        /* النص الأخير متجاوب */
        .final-note {
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            font-weight: 900;
            color: #f4e0ff;
            text-shadow: 4px 4px 0 #9d44d4, 0 0 min(4vw, 120px) #ffbaea, 0 0 min(6vw, 200px) #ff99ff;
            background: linear-gradient(135deg, #f3d2ff, #e6a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-top: 3px solid #ffb5ff;
            border-bottom: 3px solid #ffb5ff;
            padding: 1rem 0.5rem;
            margin-top: 20px;
            letter-spacing: 2px;
            transform: perspective(800px) rotateX(1deg);
            text-align: center;
            width: 100%;
            word-break: break-word;
        }

        /* تلميح الباسورد للجوال */
        .hint-text {
            margin-top: 30px;
            font-size: clamp(1.2rem, 4vw, 2rem);
            color: #dcb0ff;
            text-shadow: 0 0 min(2vw, 30px) #b266ff;
        }
    </style>
</head>
<body>

<!-- تأثير إضاءة حواف الشاشة ثلاثي الأبعاد -->
<div class="edge-glow-3d" id="edgeGlow3d">
    <div class="light-path"></div>
    <div class="edge-runner">
        <div class="runner"></div>
        <div class="runner"></div>
        <div class="runner"></div>
    </div>
    <div class="corner-beam top-left"></div>
    <div class="corner-beam top-right"></div>
    <div class="corner-beam bottom-left"></div>
    <div class="corner-beam bottom-right"></div>
    <div class="edge-lines"></div>
    <div class="edge-3d-perspective"></div>
</div>

<!-- شاشة التحميل -->
<div id="loadingScreen" class="loading-screen">
    <div class="spinner-circle">
        <div class="loading-text">استـني ي حبيبتي ♡#</div>
    </div>
</div>

<!-- الصفحة الرئيسية (كلمة المرور) -->
<div id="mainPage" class="main-page">
    <div id="mainFalling" class="main-falling"></div>
    <div class="container">
        <div class="glow-title">🔐 سـحـوره</div>
        <input type="text" id="passwordInput" class="input-password" placeholder="كلمة المرور" value="">
        <div id="loginBtn" class="glow-button">دوسي يحبي 😍❤</div>
        <div class="hint-text">الباسورد: LOVE</div>
    </div>
</div>

<!-- الصفحة الاحتفالية الجديدة -->
<div id="lovePage" class="love-page">
    <div class="hearts-rain" id="heartsRain"></div>
    
    <!-- إضاءات متحركة على الحواف -->
    <div class="edge-lights" id="edgeLights"></div>
    
    <div class="love-content">

        <!-- العنوان الرئيسي -->
        <h1 class="main-title-3d">سـحـوره |♡| سـيـوده</h1>

        <!-- الصور العمودية (حقيقية) -->
        <div class="vertical-images">

            <div class="image-card">
                <img class="real-img" src="https://i.ibb.co/1fT1J6m6/IMG.jpg" alt="صورة حب 1" onerror="this.src='https://via.placeholder.com/400/ff66ff/ffffff?text=LOVE'">
                <div class="card-caption">بحـــبك ي حـياتي 💙🔐</div>
            </div>

            <div class="image-card">
                <img class="real-img" src="https://i.ibb.co/VpS0PKjg/IMG.jpg" alt="صورة حب 2" onerror="this.src='https://via.placeholder.com/400/ff66ff/ffffff?text=LOVE'">
                <div class="card-caption">بعـشقڪ ❤#</div>
            </div>

            <div class="image-card">
                <img class="real-img" src="https://i.ibb.co/b5DTVt2T/IMG-20251217-231614-349.jpg" alt="صورة حب 3" onerror="this.src='https://via.placeholder.com/400/ff66ff/ffffff?text=LOVE'">
                <div class="card-caption">بـمـوت فيڪي 💙🔐</div>
            </div>

            <div class="image-card">
                <img class="real-img" src="https://i.ibb.co/43hgbqX/IMG-20251103-WA0015.jpg" alt="صورة حب 4" onerror="this.src='https://via.placeholder.com/400/ff66ff/ffffff?text=LOVE'">
                <div class="card-caption">مـلاڪي || سـحورتي</div>
            </div>

            <div class="image-card">
                <img class="real-img" src="https://i.ibb.co/cKfKkX1d/IMG-20250908-WA0105.jpg" alt="صورة حب 5" onerror="this.src='https://via.placeholder.com/400/ff66ff/ffffff?text=LOVE'">
                <div class="card-caption">بـدمنك ي مـزتي</div>
            </div>

            <div class="image-card">
                <img class="real-img" src="https://i.ibb.co/fdN6VY4V/IMG-mb9mdsja.jpg" alt="صورة حب 6" onerror="this.src='https://via.placeholder.com/400/ff66ff/ffffff?text=LOVE'">
                <div class="card-caption">عمـري ي نـاس</div>
            </div>

            <div class="image-card">
                <img class="real-img" src="https://i.ibb.co/QvbM8352/IMG-20250908-WA0106-1.jpg" alt="صورة حب 7" onerror="this.src='https://via.placeholder.com/400/ff66ff/ffffff?text=LOVE'">
                <div class="card-caption">بــححححبك</div>
            </div>

            <div class="image-card">
                <img class="real-img" src="https://i.ibb.co/YFG09gmz/IMG-20250816-WA0024.jpg" alt="صورة حب 8" onerror="this.src='https://via.placeholder.com/400/ff66ff/ffffff?text=LOVE'">
                <div class="card-caption">حـبيبتي</div>
            </div>
        </div>

        <!-- التذييل الأول -->
        <div class="love-footer">يـارب نـكون سـوا دايـما</div>

        <!-- النص الأخير -->
        <div class="final-note">حـياتي | سحـورتي | لـ سيـوده</div>

    </div>
</div>

<script>
    (function() {
        const loadingScreen = document.getElementById('loadingScreen');
        const mainPage = document.getElementById('mainPage');
        const mainFalling = document.getElementById('mainFalling');
        const lovePage = document.getElementById('lovePage');
        const loginBtn = document.getElementById('loginBtn');
        const passwordInput = document.getElementById('passwordInput');
        const edgeLights = document.getElementById('edgeLights');

        // إنشاء عناصر التساقط لشاشة التحميل
        function createLoadingFalling() {
            const items = [
                '❤️', '💜', '💕', '💖', '💗', '✨', '🎀', '🎊', '🎉',
                '⭐', '🌟', '💫', '⚡', '🌸', '🌺', '💮', '🪄',
                'سحوره', 'سيوده', '♡', '💙', '🔮', '💝', '💞'
            ];
            for (let i = 0; i < 40; i++) {
                const item = document.createElement('div');
                item.classList.add('falling-item');
                item.innerHTML = items[Math.floor(Math.random() * items.length)];
                item.style.left = Math.random() * 100 + '%';
                item.style.animationDuration = (3 + Math.random() * 6) + 's';
                item.style.animationDelay = (Math.random() * 3) + 's';
                item.style.fontSize = (1 + Math.random() * 2) + 'rem';
                item.style.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
                item.style.textShadow = `0 0 20px hsl(${Math.random() * 360}, 100%, 60%)`;
                loadingScreen.appendChild(item);
            }
        }

        // إنشاء عناصر التساقط للصفحة الرئيسية
        function createMainFalling() {
            const items = [
                '❤️', '💜', '💕', '💖', '💗', '✨', '🎀', '🎊', '🎉',
                '⭐', '🌟', '💫', '⚡', '🌸', '🌺', '🪄', '💮',
                'سحوره', 'سيوده', '♡', '💙', '🔮', '💝', '💞',
                '🌈', '🦋', '🌙', '☄️', '💎', '👑', '🌹'
            ];
            for (let i = 0; i < 30; i++) {
                const item = document.createElement('div');
                item.classList.add('main-falling-item');
                item.innerHTML = items[Math.floor(Math.random() * items.length)];
                item.style.left = Math.random() * 100 + '%';
                item.style.animationDuration = (4 + Math.random() * 7) + 's';
                item.style.animationDelay = (Math.random() * 4) + 's';
                item.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
                item.style.color = `hsl(${Math.random() * 360}, 100%, 75%)`;
                item.style.textShadow = `0 0 25px hsl(${Math.random() * 360}, 100%, 65%)`;
                mainFalling.appendChild(item);
            }
        }

        // إنشاء الإضاءات المتحركة على الحواف
        function createEdgeLights() {
            for (let i = 0; i < 30; i++) {
                const light = document.createElement('div');
                light.classList.add('light-beam');
                
                // توزيع الإضاءات على الحواف (يسار، يمين، وفي المنتصف أحياناً)
                if (i < 10) {
                    light.style.left = (Math.random() * 5) + '%'; // الجهة اليسرى
                } else if (i < 20) {
                    light.style.left = (95 + Math.random() * 5) + '%'; // الجهة اليمنى
                } else {
                    light.style.left = (Math.random() * 100) + '%'; // في المنتصف
                }
                
                light.style.animationDuration = (3 + Math.random() * 5) + 's';
                light.style.animationDelay = (Math.random() * 4) + 's';
                light.style.height = (100 + Math.random() * 150) + 'px';
                light.style.width = (2 + Math.random() * 4) + 'px';
                light.style.opacity = 0.4 + Math.random() * 0.5;
                light.style.filter = `blur(${4 + Math.random() * 8}px)`;
                edgeLights.appendChild(light);
            }
        }

        // مطر قلوب وأسماء متجاوب
        function generateRomanticRain() {
            const rain = document.getElementById('heartsRain');
            rain.innerHTML = '';
            
            const heartSymbols = ['❤️', '💜', '🧡', '💕', '💖', '💗', '🩷', '💘', '💝', '💞', '💓', '💔' ,'❣️'];
            const names = ['سحوره', 'سيوده', '♡', '💙', '🔐', '✨'];
            
            for (let i = 0; i < 40; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-drop');
                heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (4 + Math.random() * 7) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.fontSize = (1.5 + Math.random() * 3) + 'rem';
                heart.style.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
                heart.style.filter = `drop-shadow(0 0 15px hsl(${Math.random() * 360}, 100%, 65%))`;
                heart.style.opacity = 0.7 + Math.random() * 0.3;
                rain.appendChild(heart);
            }
            
            for (let i = 0; i < 25; i++) {
                const nameEl = document.createElement('div');
                nameEl.classList.add('heart-drop');
                nameEl.innerHTML = names[Math.floor(Math.random() * names.length)];
                nameEl.style.left = Math.random() * 100 + '%';
                nameEl.style.animationDuration = (5 + Math.random() * 8) + 's';
                nameEl.style.animationDelay = (Math.random() * 5) + 's';
                nameEl.style.fontSize = (1.5 + Math.random() * 2.5) + 'rem';
                nameEl.style.background = 'linear-gradient(145deg, #ffaaff, #ff66ff)';
                nameEl.style.webkitBackgroundClip = 'text';
                nameEl.style.webkitTextFillColor = 'transparent';
                nameEl.style.fontWeight = '900';
                nameEl.style.textShadow = '0 0 20px #ff80ff, 0 0 50px #ff41ff';
                rain.appendChild(nameEl);
            }
        }

        // تهيئة جميع العناصر
        createLoadingFalling();
        createMainFalling();

        // بعد 8 ثوانٍ تختفي شاشة التحميل
        setTimeout(() => {
            loadingScreen.classList.add('loading-hidden');
            mainPage.style.display = 'flex';
        }, 8000);

        function checkPassword() {
            if (passwordInput.value.trim() === 'LOVE') {
                mainPage.style.display = 'none';
                lovePage.style.display = 'flex';
                generateRomanticRain();
                createEdgeLights(); // إنشاء الإضاءات المتحركة عند الدخول
                
                // تفعيل تأثير إضاءة الحواف بشكل كامل (يمكن إضافة كلاس إضافي إذا أردت)
                const edgeGlow = document.getElementById('edgeGlow3d');
                if (edgeGlow) {
                    edgeGlow.style.opacity = '1';
                }
            } else {
                alert('الباسورد خطأ! جربي LOVE');
            }
        }

        loginBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPassword(); });

        // إخفاء كل شيء في البداية
        lovePage.style.display = 'none';
        mainPage.style.display = 'none';
        
        // التأكد من ظهور تأثير الحواف طوال الوقت (موجود في الخلفية دائماً)
        // لا حاجة لتعديله لأنه عنصر ثابت
    })();
</script>

</body>
</html>
